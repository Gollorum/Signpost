plugins {
    // see https://fabricmc.net/develop/ for new versions.
    // The plugin id changed with Loom 1.15: 26.x ships deobfuscated, so the plain
    // 'net.fabricmc.fabric-loom' is the non-remapping variant to use here
    // ('net.fabricmc.fabric-loom-remap' is the one for 1.21.11 and older).
    id 'net.fabricmc.fabric-loom' version '1.17.20' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.147' apply false
}