# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=2.04.0
group_id=gollorum.signpost
java_version=25
# The bytecode the mod itself is compiled to, which is NOT the same as the JDK it runs on.
# Forge bundles SpongePowered Mixin 0.8.7, whose highest compatibility level is JAVA_21, so it
# rejects both a `"compatibilityLevel": "JAVA_25"` and any mixin class file newer than v65 with
# "Mixin config ... specifies compatibility level JAVA_25 which is not recognised". Fabric and
# NeoForge bundle Fabric's mixin fork, which understands up to JAVA_25 and is happy either way.
# So the whole mod targets 21 while running on the Java 25 toolchain. Raise this (and the
# compatibilityLevel in the four *.mixins.json) once Forge ships a newer mixin.
java_bytecode_version=21

# Common
minecraft_version=26.2
mod_name=signpost
mod_author=Gollorum
mod_id=signpost
license=GNU GENERAL PUBLIC LICENSE
credits=
description=This is a mod with sign posts. It sometimes gets updates if the author is not too lazy. Which means that it very rarely gets updates.
minecraft_version_range=[26.2, 26.3)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.2-2
# Parchment has published nothing for the 26.x line, and 26.x ships deobfuscated vanilla with
# Mojang's official parameter names anyway, so there is no parchment layer any more. Re-add the
# `parchment { }` blocks in common/ and neoforge/build.gradle if it ever ships for 26.x.

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.160.0+26.2
fabric_loader_version=0.19.5
cloth_config_version=26.2.155
modmenu_version=20.0.2

# Forge, see https://files.minecraftforge.net/ for new versions
forge_version=65.1.3
forge_loader_version_range=[65,)

# NeoForge, see https://neoforged.net/ for new versions
neoforge_version=26.2.0.87
neoforge_loader_version_range=[4,)

# Optional mod integrations. All of these are compile-only.
# Waystones dropped Forge with the 26.x line - its last Forge build is 21.11.9 - so the version
# is no longer a single shared property and the Forge subproject has no Waystones integration.
# See https://modrinth.com/project/waystones
waystones_fabric_version=26.2.0.12
waystones_neoforge_version=26.2.0.12
# Repurposed Structures is versioned separately per loader, and has no Forge build
# past 1.20.1 - so the Forge subproject has no RS integration at all.
# See https://modrinth.com/project/repurposed-structures-fabric (Fabric)
# and https://modrinth.com/project/repurposed-structures-forge (NeoForge).
repurposed_structures_fabric_version=7.7.6+26.2-fabric
repurposed_structures_neoforge_version=7.7.6+26.2-neoforge

# Gradle
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
org.gradle.caching=true
# ForgeGradle 6 needed org.gradle.daemon=false and org.gradle.parallel=false: it provisioned
# the patched Minecraft artifact lazily during dependency resolution, and in a reused daemon
# (or under parallel execution) the project services it used were already closed, giving
# "project services has been closed" and then
# "Could not find net.minecraftforge:forge:...mapped_official...".
# ForgeGradle 7 provisions differently and no longer has that problem - verified by cleaning
# and rebuilding :forge: twice in one reused daemon with --parallel. Its own MDK turns both on.
# The same rewrite retired the systemProp.net.minecraftforge.gradle.repo.sources.force
# workaround for "duplicate entry: mcp/client/Start.class".
org.gradle.parallel=true
