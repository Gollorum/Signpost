# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=2.04.0
group_id=gollorum.signpost
java_version=21

# Common
minecraft_version=1.21.1
mod_name=signpost
mod_author=Gollorum
mod_id=signpost
license=GNU GENERAL PUBLIC LICENSE
credits=
description=This is a mod with sign posts. It sometimes gets updates if the author is not too lazy. Which means that it very rarely gets updates.
minecraft_version_range=[1.21, 1.21.2)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21.1
parchment_version=2024.11.17

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.116.17+1.21.1
fabric_loader_version=0.17.3
cloth_config_version=15.0.140
modmenu_version=11.0.4

# Forge, see https://files.minecraftforge.net/ for new versions
forge_version=52.1.16
forge_loader_version_range=[52,)

# NeoForge, see https://neoforged.net/ for new versions
neoforge_version=21.1.250
neoforge_loader_version_range=[4,)

# Optional mod integrations. All of these are compile-only.
# Waystones publishes a build for every loader under one version;
# see https://modrinth.com/project/waystones
#
# The pin is deliberately behind the newest 1.21.1 release: Waystones rebuilt every
# 1.21.1 artifact from 21.1.36 onwards with Loom 1.14.10, and Loom refuses to consume a
# mod built by a newer Loom than its own. Loom 1.14+ needs Gradle 9, which ForgeGradle 6
# does not support, so this build stays on Gradle 8 / Loom 1.13 and compiles against
# 21.1.15, the last 1.21.1 build made with Loom 1.7. Only the adapter API is used and it
# is unchanged, so the integration still works against current Waystones at runtime -
# the run folders can and do carry a newer jar. Revisit if Forge is ever dropped.
waystones_version=21.1.15+1.21.1
# Repurposed Structures is versioned separately per loader, and has no Forge build
# past 1.20.1 - so the Forge subproject has no RS integration at all.
# See https://modrinth.com/project/repurposed-structures-fabric (Fabric)
# and https://modrinth.com/project/repurposed-structures-forge (NeoForge).
# Unlike on 1.21.11, no RS pin is needed here: the 1.21.1 builds are made with Loom 1.6,
# so the current release is readable and both loaders track the same RS version.
repurposed_structures_fabric_version=7.5.22+1.21.1-fabric
repurposed_structures_neoforge_version=7.5.22+1.21.1-neoforge

# Gradle
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
org.gradle.caching=true
# Both of the following must stay off for the forge subproject to build.
# ForgeGradle provisions the patched Minecraft artifact lazily, during dependency
# resolution, using project services. In a reused daemon - or under parallel
# execution - those services are already closed by then, and the build dies with
# "project services has been closed" followed by
# "Could not find net.minecraftforge:forge:...mapped_official...".
# neoforge and fabric build fine either way; forge is what needs this.
org.gradle.parallel=false
org.gradle.daemon=false
