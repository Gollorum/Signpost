plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}
repositories {
    // Cloth Config
    maven {
        url "https://maven.shedaniel.me/"
        content { includeGroupAndSubgroups "me.shedaniel" }
    }
    // Mod Menu
    maven {
        url "https://maven.terraformersmc.com/releases/"
        content { includeGroup "com.terraformersmc" }
    }
    // Waystones (and its Balm library)
    maven {
        url "https://maven.twelveiterations.com/repository/maven-public/"
        content { includeGroup "net.blay09.mods" }
    }
    // Repurposed Structures
    maven {
        url "https://nexus.resourcefulbees.com/repository/telepathicgrunt/"
        content { includeGroup "com.telepathicgrunt" }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    modApi "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    modApi "com.terraformersmc:modmenu:${modmenu_version}"

    modCompileOnly("com.telepathicgrunt:RepurposedStructures:${repurposed_structures_fabric_version}") {
        // RS declares MidnightLib and a second (maven.modrinth) Mod Menu as transitive
        // mod dependencies. We only compile against RSConditionsRegistry, so keep them out.
        transitive = false
    }
    // Waystones 21.1.x pulls JourneyMap and other CurseForge artifacts in as transitive mod
    // dependencies; only the adapter API is compiled against, so keep them off the classpath.
    modCompileOnly("net.blay09.mods:waystones-fabric:${waystones_version}") { transitive = false }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
            // -PsignpostQuickPlay=<saveName> makes the client boot straight into that save.
            // Set only by the full-runtime-test harness; normal dev runs are unaffected.
            if (project.hasProperty('signpostQuickPlay')) programArgs('--quickPlaySingleplayer', project.signpostQuickPlay)
        }
        clientWithMods {
            client()
            setConfigName('Fabric Client With Mods')
            ideConfigGenerated(true)
            runDir('runs/client_with_mods')
            if (project.hasProperty('signpostQuickPlay')) programArgs('--quickPlaySingleplayer', project.signpostQuickPlay)
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        serverWithMods {
            server()
            setConfigName('Fabric Server With Mods')
            ideConfigGenerated(true)
            runDir('runs/server_with_mods')
        }
    }
}
sourceSets.main.resources.srcDirs(
        '../common/src/generated/resources',
        'src/generated/resources'
)
