plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}
repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }

    maven {
        url "https://maven.twelveiterations.com/repository/maven-public/"
        content {
            includeGroup "net.blay09.mods"
        }
    }

    maven {
        url "https://nexus.resourcefulbees.com/repository/telepathicgrunt/"
    }

    maven {
        url "https://api.modrinth.com/maven/"
    }

}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    modApi "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    modApi "com.terraformersmc:modmenu:17.0.0-alpha.1"

    // RepurposedStructures: pin to a Loom 1.13-compatible build.
    modCompileOnly "com.telepathicgrunt:RepurposedStructures:7.5.22+1.21.9-fabric"

    modCompileOnly("net.blay09.mods:waystones-fabric:21.11.2") {
        capabilities {
            // Select the MC-specific capability that the published variants provide
            requireCapability "net.blay09.mods:waystones-fabric-1.21.11:21.11.2"
        }
    }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        clientWithMods {
            client()
            setConfigName('Fabric Client With Mods')
            ideConfigGenerated(true)
            runDir('runs/client_with_mods')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        serverWithMods {
            server()
            setConfigName('Fabric Server With Mods')
            ideConfigGenerated(true)
            runDir('runs/server_with_mods')
        }
    }
}
sourceSets.main.resources.srcDirs(
        '../common/src/generated/resources',
        'src/generated/resources'
)

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
loom.remapConfigurations.configureEach {
    configurations.named(it.name) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
