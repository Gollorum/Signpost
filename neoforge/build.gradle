plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'idea'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            // -PsignpostQuickPlay=<saveName> makes the client boot straight into that save.
            // Set only by the full-runtime-test harness; normal dev runs are unaffected.
            if (project.hasProperty('signpostQuickPlay')) programArguments.addAll('--quickPlaySingleplayer', project.signpostQuickPlay)
        }
        clientWithMods {
            client() // same setup as normal client
            ideName = "runClient with Mods (${project.path})"
            gameDirectory = project.file('run_with_mods')
            // 26.2 deprecated the `logoFile` mods.toml property and the `fml.menu.mods.info.*`
            // translation keys, and NeoForge raises a *blocking* warning screen for each in dev.
            // Waystones, Shogi, Repurposed Structures, Kuma API and Balm have not migrated yet, so
            // this run cannot reach the main menu on third-party jars we do not control - it just
            // times out. These two properties suppress exactly those two deprecation categories
            // (not warnings in general - a real mod-loading error still stops the run).
            // Deliberately NOT set on the plain `client` run above: signpost's own mods.toml must
            // stay honest there, and that run is what would catch us regressing to `logoFile`.
            systemProperty('neoforge.warnings.logofile.hide', 'true')
            systemProperty('neoforge.warnings.mods.info.description.hide', 'true')
            if (project.hasProperty('signpostQuickPlay')) programArguments.addAll('--quickPlaySingleplayer', project.signpostQuickPlay)
        }
        data {
            clientData()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('../common/src/generated/resources/').getAbsolutePath(), '--existing', file('../common/src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
        serverWithMods {
            server()
            ideName = "runServer with Mods (${project.path})"
            gameDirectory = project.file('run_with_mods')
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDirs (
    '../common/src/generated/resources',
    'src/generated/resources'
)

repositories {
    maven {
        url "https://nexus.resourcefulbees.com/repository/telepathicgrunt/"
    }
    maven {
        url "https://maven.twelveiterations.com/repository/maven-public/"
        content {
            includeGroup "net.blay09.mods"
        }
    }
}

dependencies {
    compileOnly "com.telepathicgrunt:RepurposedStructures:${repurposed_structures_neoforge_version}"
    compileOnly "net.blay09.mods:waystones-neoforge:${waystones_neoforge_version}"
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}