import org.gradle.api.attributes.java.TargetJvmVersion

plugins {
    id 'java-library'
    id 'maven-publish'
}

group = group_id

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

tasks.withType(JavaCompile).configureEach {
    // See java_bytecode_version in gradle.properties: Forge's mixin cannot read Java 25 class
    // files, so the toolchain is 25 but the bytecode is older.
    //
    options.release = java_bytecode_version as Integer
}

// Lowering the bytecode version also lowers TARGET_JVM_VERSION on the resolvable
// configurations, and dependency resolution then refuses the Java 25 artifacts the toolchain
// actually needs:
//   No matching variant of net.neoforged:neoform:26.1.2-1 ...
//   Incompatible because this component declares a component, compatible with Java 25 and the
//   consumer needed a component, compatible with Java 21
// The two are independent - we consume Java 25 libraries and emit older bytecode - so the
// attribute is put back to the toolchain version here.
// Only the resolve-side configurations: stamping an attribute on the consumable ones would
// make commonJava and commonResources ambiguous, since they share a capability.
configurations.configureEach {
    if (canBeResolved && !canBeConsumed) {
        attributes {
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, java_version as Integer)
        }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

// Declare capabilities on the outgoing configurations.
// Read more about capabilities here: https://docs.gradle.org/current/userguide/component_capabilities.html#sec:declaring-additional-capabilities-for-a-local-component
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${project.name}:$version")
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

sourcesJar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group, //Else we target the task's group.
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'cloth_config_version'         : cloth_config_version,
            'modmenu_version'              : modmenu_version,
            'waystones_fabric_version'     : waystones_fabric_version,
            'waystones_neoforge_version'   : waystones_neoforge_version,
            'repurposed_structures_fabric_version'   : repurposed_structures_fabric_version,
            'repurposed_structures_neoforge_version' : repurposed_structures_neoforge_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'forge_version'                : forge_version,
            'forge_loader_version_range'   : forge_loader_version_range,
            'credits'                      : credits,
            'java_version'                 : java_version,
            'java_bytecode_version'        : java_bytecode_version
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace("\n", "\\\\n") : value]
    }

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        // Only declare the local maven target when it is actually configured,
        // otherwise the repository is defined with a null url.
        var localMavenUrl = System.getenv('local_maven_url')
        if (localMavenUrl != null && !localMavenUrl.isBlank()) {
            maven {
                url localMavenUrl
            }
        }
    }
}
