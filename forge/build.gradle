plugins {
    id 'multiloader-loader'
    id 'idea'
    // ForgeGradle 7 is the Gradle 9 line. FG6 refuses to apply on Gradle 9 outright
    // ("Versions Gradle 9.0 and newer are not supported yet"), and its artifact is a
    // different coordinate (net.minecraftforge:ForgeGradle) than FG7's
    // (net.minecraftforge:forgegradle) - the plugin id is the same for both.
    id 'net.minecraftforge.gradle' version '[7.0.29,8.0)'
}

jar {
    manifest {
        // Forge finds our mixin configs through this manifest attribute rather than a
        // [[mixins]] block. FG7 has no mixin Gradle plugin, so this is set by hand.
        attributes["MixinConfigs"] = "${mod_id}.mixins.json,${mod_id}.forge.mixins.json"
    }
}

minecraft {
    // 26.x is deobfuscated, so there is no `mappings channel:` and nothing to reobf.

    runs {
        configureEach {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            // In a dev run the mod is loaded from build/classes, so the jar's MixinConfigs
            // manifest attribute is never read and the configs have to be named on the command
            // line instead. FG6 got this for free from the org.spongepowered.mixin Gradle
            // plugin, which FG7 has no equivalent of. Without it every mixin silently does not
            // apply, and the first accessor to be called throws - not a mixin error.
            args "--mixin.config=${mod_id}.mixins.json",
                 "--mixin.config=${mod_id}.forge.mixins.json"
        }

        register('client') {
            workingDir = layout.projectDirectory.dir('runs/client')
            // -PsignpostQuickPlay=<saveName> makes the client boot straight into that save.
            // Set only by the full-runtime-test harness; normal dev runs are unaffected.
            if (project.hasProperty('signpostQuickPlay')) args('--quickPlaySingleplayer', project.signpostQuickPlay)
        }

        register('clientWithMods') {
            workingDir = layout.projectDirectory.dir('runs/client_with_mods')
            // ForgeGradle merges the userdev run template (main class + launch target) only
            // into runs whose name matches one in the userdev config.json - SlimeLauncherOptions
            // looks the name up verbatim. A custom-named run gets neither, and fails with
            // "No main class specified and classpath is not an executable jar".
            // These values mirror the 'client' template in forge's userdev config.json.
            mainClass = 'net.minecraftforge.bootstrap.ForgeBootstrap'
            args '--gameDir', '.', '--launchTarget', 'forge_userdev_client',
                 '--version', 'MOD_DEV', '--assetIndex', '{asset_index}', '--assetsDir', '{assets_root}'
            if (project.hasProperty('signpostQuickPlay')) args('--quickPlaySingleplayer', project.signpostQuickPlay)
        }

        register('server') {
            workingDir = layout.projectDirectory.dir('runs/server')
        }

        register('serverWithMods') {
            workingDir = layout.projectDirectory.dir('runs/server_with_mods')
            mainClass = 'net.minecraftforge.bootstrap.ForgeBootstrap'
            args '--gameDir', '.', '--launchTarget', 'forge_userdev_server'
        }

        register('data') {
            workingDir = layout.projectDirectory.dir('runs/data')
            args '--mod', mod_id, '--all',
                 '--output', file('../common/src/generated/resources/').absolutePath,
                 '--existing', file('../common/src/main/resources/').absolutePath
        }
    }
}

sourceSets.main.resources.srcDirs (
    '../common/src/generated/resources',
    'src/generated/resources'
)

repositories {
    // Neither optional integration has a Forge build for 26.x: Repurposed Structures stopped at
    // 1.20.1 and Waystones stopped at 21.11.9. So this subproject declares no integration
    // repositories or dependencies, and both gollorum.signpost.compat.RepurposedStructuresAdapter
    // and WaystonesAdapter stay disabled on this loader.
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    // Version taken from forge's own userdev config.json for this build.
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'

    // Forge's hack fix
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}
