plugins {
    id 'multiloader-loader'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.47,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}
mixin {
    config("${mod_id}.mixins.json")
    config("${mod_id}.forge.mixins.json")
}
jar {
    manifest {
        attributes["MixinConfigs"] = "${mod_id}.mixins.json,${mod_id}.forge.mixins.json"
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    copyIdeResources = true //Calls processResources when in dev

    reobf = false // Forge 1.20.6+ uses official mappings at runtime, so we shouldn't reobf from official to SRG

    // Automatically enable forge AccessTransformers if the file exists
    // This location is hardcoded in Forge and can not be changed.
    // https://github.com/MinecraftForge/MinecraftForge/blob/be1698bb1554f9c8fa2f58e32b9ab70bc4385e60/fmlloader/src/main/java/net/minecraftforge/fml/loading/moddiscovery/ModFile.java#L123
    // Forge still uses SRG names during compile time, so we cannot use the common AT's
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformer = at
    }

    runs {

        client {
            workingDirectory file('runs/client')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Client'
            // -PsignpostQuickPlay=<saveName> makes the client boot straight into that save.
            // Set only by the full-runtime-test harness; normal dev runs are unaffected.
            if (project.hasProperty('signpostQuickPlay')) args('--quickPlaySingleplayer', project.signpostQuickPlay)
            mods {
                modClientRun {
                    source sourceSets.main
                }
            }
        }

        clientWithMods {
            workingDirectory file('runs/client_with_mods')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'ClientWithMods'
            // ForgeGradle merges the userdev run template (main class + launch target) only
            // into runs literally named client/server/data. A custom-named run gets neither,
            // and fails with "No main class specified and classpath is not an executable jar".
            // These values mirror the 'client'/'server' templates in forge's userdev config.json.
            main 'net.minecraftforge.bootstrap.ForgeBootstrap'
            args '--gameDir', '.', '--launchTarget', 'forge_userdev_client',
                 '--version', 'MOD_DEV', '--assetIndex', '{asset_index}', '--assetsDir', '{assets_root}'
            if (project.hasProperty('signpostQuickPlay')) args('--quickPlaySingleplayer', project.signpostQuickPlay)
            mods {
                modClientRun {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory file('runs/server')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Server'
            mods {
                modServerRun {
                    source sourceSets.main
                }
            }
        }

        serverWithMods {
            workingDirectory file('runs/server_with_mods')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'ServerWithMods'
            main 'net.minecraftforge.bootstrap.ForgeBootstrap'
            args '--gameDir', '.', '--launchTarget', 'forge_userdev_server'
            mods {
                modServerRun {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory file('runs/data')
            ideaModule "${rootProject.name}.${project.name}.main"
            args '--mod', mod_id, '--all', '--output', file('../common/src/generated/resources/'), '--existing', file('../common/src/main/resources/')
            taskName 'Data'
            mods {
                modDataRun {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources.srcDirs (
    '../common/src/generated/resources',
    'src/generated/resources'
)

repositories {
    // Waystones (and its Balm library).
    // Note: Repurposed Structures has no Forge build past 1.20.1, so there is no
    // repository for it here and gollorum.signpost.compat.RepurposedStructuresAdapter
    // stays disabled on this loader.
    maven {
        url "https://maven.twelveiterations.com/repository/maven-public/"
        content { includeGroup "net.blay09.mods" }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor "org.spongepowered:mixin:0.8.5-SNAPSHOT:processor"
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0-beta.7'

    // Forge's hack fix
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }

    compileOnly "net.blay09.mods:waystones-forge:${waystones_version}"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            fg.component(it)
        }
    }
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}